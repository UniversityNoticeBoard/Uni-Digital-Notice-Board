build-image-job:
  runs-on: ubuntu-latest
  needs: build-website-job
  steps:
    - name: Welcome To the Image Building Job
      run: echo "Image Building Job Starting"

    - name: Clone The Repo
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DH_USERNAME }}
        password: ${{ secrets.DH_TOKEN }}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DH_USERNAME }}/static-website:latest .

    - name: Push Image to Docker Hub
      run: docker push ${{ secrets.DH_USERNAME }}/static-website:latest
