name: ci-wf

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Step
        run: echo "Welcome TO the Linting Job"

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: npm install

      - name: Lint HTML and CSS Files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

  build-website-job:
    runs-on: ubuntu-latest
    needs: lint-job
    steps:
      - name: Welcome to Build Job
        run: echo "Welcome to Build Job"

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Website with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" --no-cache

  build-image-job:
    runs-on: ubuntu-latest
    needs: build-website-job
    steps:
      - name: Welcome To Image Job
        run: echo "Image Building Job Starting"

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_USERNAME }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DH_USERNAME }}/static-website:latest .

      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DH_USERNAME }}/static-website:latest
